<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Game Boy">
<meta name="theme-color" content="#12110f">
<link rel="apple-touch-icon" sizes="180x180" href="symbol-180.png">
<link rel="icon" href="symbol.png">
<title>Game Boy Advance SP – Zelda Edition</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #12110f;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; touch-action: none;
    overscroll-behavior: none;
  }
  /* Das Geraet behaelt sein Seitenverhaeltnis und wird eingepasst - wie in
     der Fenster-App auch. */
  #geraet { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  #gehaeuse { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  /* Vollbild: das Bild bekommt den ganzen Platz oben, darunter bleibt nur das
     Unterteil des Geraets mit den Knoepfen stehen. Ein echtes Browser-Vollbild
     gibt es auf dem iPhone nicht - und es waere hier auch nutzlos, weil dann
     die Bedienung verschwinden wuerde. */
  body.vollbild #geraet { left: 0; top: 0; transform: none;
                          width: 100% !important; height: 100% !important; }
  body.vollbild #gehaeuse { display: none; }
  #unterteil { display: none; position: absolute; left: 0; bottom: 0; width: 100%;
               overflow: hidden; }
  body.vollbild #unterteil { display: block; }
  #unterteil img { position: absolute; left: 0; width: 100%; pointer-events: none; }

  /* Querformat: geteilter N64-Controller. Die Stickkappe ist ein eigenes
     Element, damit sie dem Finger folgen kann - im SVG fehlt sie deshalb. */
  #kappe { position: absolute; border-radius: 50%; pointer-events: none;
           background: radial-gradient(circle at 34% 30%, #b28e3e, #604614);
           box-shadow: 0 4px 10px rgba(70,50,12,.6),
                       inset 0 -3px 8px rgba(40,28,6,.55),
                       inset 0 3px 8px rgba(255,238,190,.35);
           transition: none; }
  #bild { position: absolute; background: #090d0b; overflow: hidden; }
  #bild canvas, #bild video { width: 100% !important; height: 100% !important; display: block; }
  .knopf { position: absolute; border-radius: 12px; }
  .knopf.gedrueckt { background: rgba(0,0,0,.28); }
  #dpad { position: absolute; }
  #dpad .feld { position: absolute; width: 50%; height: 50%; }

  /* --- Auswahlbildschirm, dem der Fenster-App nachempfunden --- */
  #start { position: absolute; inset: 0; display: flex; flex-direction: column;
           color: #e4dcc2; padding: 3% 4% 2% 4%; }
  #start h1 { font-size: clamp(9px, 2.7vw, 15px); letter-spacing: .16em; text-align: center;
              color: #cea54e; margin: 0 0 2% 0; font-weight: 600; }
  #liste { flex: 1 1 auto; min-height: 0; overflow-y: auto; list-style: none;
           margin: 0; padding: 0; scrollbar-width: none; }
  #liste::-webkit-scrollbar { display: none; }
  #liste li { display: flex; align-items: center; gap: .5em; padding: .35em .5em;
              border-radius: 8px; border: 2px solid transparent; }
  #liste li.gewaehlt { background: rgba(196,158,60,.23); border-color: #e2c26c; }
  #liste li .pfeil { color: #e8ca78; opacity: 0; font-size: clamp(8px, 2.4vw, 12px); }
  #liste li.gewaehlt .pfeil { opacity: 1; }
  #liste .titel { font-size: clamp(9px, 2.7vw, 14px); font-weight: 600; line-height: 1.2; }
  #liste .zeile2 { font-size: clamp(7px, 2vw, 10px); color: #9b9078; }
  #liste .neu .titel { color: #cea54e; }
  #fuss { flex: 0 0 auto; text-align: center; font-size: clamp(6px, 1.8vw, 9px);
          color: #8d846e; padding-top: 2%; line-height: 1.4; }
  #datei, #stand { display: none; }

  /* Menue im laufenden Spiel, ueber dem Bild */
  #menue { position: absolute; inset: 0; background: rgba(6,10,8,.93);
           display: flex; flex-direction: column; justify-content: center;
           padding: 5%; color: #e4dcc2; }
  #menue h2 { font-size: clamp(9px, 2.6vw, 14px); letter-spacing: .16em;
              color: #cea54e; text-align: center; margin: 0 0 5% 0; font-weight: 600; }
  #menue .zeile { font-size: clamp(9px, 2.6vw, 13px); padding: .4em .6em;
                  border-radius: 8px; border: 2px solid transparent; }
  #menue .zeile.gewaehlt { background: rgba(196,158,60,.23); border-color: #e2c26c; }
  #menue .pfeil { color: #e8ca78; opacity: 0; margin-right: .5em; }
  #menue .zeile.gewaehlt .pfeil { opacity: 1; }
  #ladebalken { text-align: center; font-size: clamp(8px, 2.4vw, 12px); color: #cea54e; }

  /* EmulatorJS bringt auf Beruehrungsgeraeten eine eigene Bildschirmsteuerung
     mit - roter Stick, A, B, Start - und legt sie ueber das Bild. Wir haben
     ein gezeichnetes Gehaeuse, das braucht es nicht. */
  .ejs_virtualGamepad_parent, .ejs_virtualGamepad_left, .ejs_virtualGamepad_right,
  .ejs_menu_bar, .ejs_volume_parent, .ejs_context_menu { display: none !important; }
</style>
</head>
<body>

<div id="geraet">
  <img id="gehaeuse" alt="">
  <div id="unterteil"><img alt=""></div>
  <div id="bild">
    <div id="game"></div>
    <div id="start">
      <h1>SPIEL WÄHLEN</h1>
      <ul id="liste"></ul>
      <div id="fuss">Steuerkreuz wählen · A startet<br>Im Spiel: SPIEL zurück zur Auswahl · Power-Schalter Menü</div>
      <div id="ladebalken"></div>
    </div>
  </div>
</div>
<input id="datei" type="file" multiple
       accept=".gb,.gbc,.gba,.n64,.z64,.v64,.smc,.sfc,.nes">
<input id="stand" type="file" accept=".state">

<script>
// ---------------------------------------------------------------------------
// Welches System steckt hinter welcher Dateiendung. "pad" entscheidet, welches
// Gehaeuse gezeichnet wird - das N64-Gehaeuse hat zusaetzlich C-Kreuz und Z.
// ---------------------------------------------------------------------------
const SYSTEME = {
  gb:  { kern: "gb",   pad: "gba", bild: "gb",  kurz: "Game Boy" },
  gbc: { kern: "gb",   pad: "gba", bild: "gb",  kurz: "Game Boy Color" },
  gba: { kern: "gba",  pad: "gba", bild: "gba", kurz: "Game Boy Advance" },
  n64: { kern: "n64",  pad: "n64", bild: "n64", kurz: "Nintendo 64" },
  z64: { kern: "n64",  pad: "n64", bild: "n64", kurz: "Nintendo 64" },
  v64: { kern: "n64",  pad: "n64", bild: "n64", kurz: "Nintendo 64" },
  smc: { kern: "snes", pad: "gba", bild: "gba", kurz: "Super Nintendo" },
  sfc: { kern: "snes", pad: "gba", bild: "gba", kurz: "Super Nintendo" },
  nes: { kern: "nes",  pad: "gba", bild: "gba", kurz: "NES" },
};

// RetroArch-Knopfnummern: 0-15 die Digitaltasten, 16-19 der linke Analogstick,
// 20-23 der rechte.
const TASTE = { B: 0, Y: 1, SELECT: 2, START: 3, UP: 4, DOWN: 5, LEFT: 6,
                RIGHT: 7, A: 8, X: 9, L: 10, R: 11, L2: 12, R2: 13 };
// Beim N64 wird das Steuerkreuz zum Analogstick - Ocarina of Time, Majora's
// Mask und Mario Kart steuern praktisch nur darueber, mit dem Digitalkreuz
// waeren sie unspielbar. Das C-Kreuz liegt beim N64-Kern auf dem rechten
// Stick, Z auf L2.
const N64_TASTE = { UP: 16, DOWN: 17, LEFT: 18, RIGHT: 19,
                    DUP: 4, DDOWN: 5, DLEFT: 6, DRIGHT: 7,
                    CUP: 20, CDOWN: 21, CLEFT: 22, CRIGHT: 23, Z: 12 };

let geo = null, aktuell = null, spiele = [], wahl = 0, laeuft = false;
let vollbild = false, letzterPad = "gba", letzteBildart = "gb";
// Ansicht fuer N64: quer als geteilter Controller oder hochkant im
// SP-Gehaeuse. Die Wahl ueberlebt das Schliessen der App.
let quer = localStorage.getItem("ansicht") === "quer";

// --- Spieleliste im Geraet speichern ---------------------------------------
// Die ROMs bleiben auf dem Telefon. Sie liegen in der Datenbank des Browsers,
// werden nie hochgeladen und ueberstehen das Schliessen der App.
function db() {
  return new Promise((ok, fehler) => {
    const a = indexedDB.open("gameboy-zelda", 1);
    a.onupgradeneeded = () => a.result.createObjectStore("spiele", { keyPath: "id" });
    a.onsuccess = () => ok(a.result);
    a.onerror = () => fehler(a.error);
  });
}

async function alleSpiele() {
  const d = await db();
  return new Promise(ok => {
    const a = d.transaction("spiele").objectStore("spiele").getAll();
    a.onsuccess = () => ok(a.result.sort((x, y) => x.name.localeCompare(y.name)));
    a.onerror = () => ok([]);
  });
}

async function merken(eintrag) {
  const d = await db();
  return new Promise(ok => {
    const t = d.transaction("spiele", "readwrite");
    t.objectStore("spiele").put(eintrag);
    t.oncomplete = ok;
  });
}

async function vergessen(id) {
  const d = await db();
  return new Promise(ok => {
    const t = d.transaction("spiele", "readwrite");
    t.objectStore("spiele").delete(id);
    t.oncomplete = ok;
  });
}

// --- Aufbau ----------------------------------------------------------------
fetch("geometrie.json").then(r => r.json()).then(async d => {
  geo = d;
  aufbauen("gba", "gb");
  spiele = await alleSpiele();
  const direkt = new URLSearchParams(location.search).get("rom");
  if (direkt) { starteFromUrl(direkt); return; }
  const wieder = sessionStorage.getItem("starte");
  if (wieder) { sessionStorage.removeItem("starte");
                const s = spiele.find(x => x.id === wieder);
                if (s) { starte(s); return; } }
  zeichneListe();
});

function einpassen() {
  if (!geo) return;
  const vb = window.visualViewport;
  const s = Math.min((vb ? vb.width : innerWidth) / geo.entwurf.w,
                     (vb ? vb.height : innerHeight) / geo.entwurf.h);
  const el = document.getElementById("geraet");
  el.style.width = (geo.entwurf.w * s) + "px";
  el.style.height = (geo.entwurf.h * s) + "px";
  // Im Vollbild bestimmt der Bildschirm die Masse (siehe Stilregeln), die
  // Aufteilung muss danach neu gerechnet werden.
  if (vollbild || (quer && letzterPad === "n64" && laeuft))
    aufbauen(letzterPad, letzteBildart);
}
addEventListener("resize", einpassen);
if (window.visualViewport) visualViewport.addEventListener("resize", einpassen);

function setzen(el, r) {
  el.style.left = r.x + "%"; el.style.top = r.y + "%";
  el.style.width = r.w + "%"; el.style.height = r.h + "%";
}

// Das Unterteil beginnt im Entwurfsraum bei y = 858 (unter dem Scharnier).
const UNTERTEIL_Y = 858, UNTERTEIL_H = 1692 - 858;

function aufbauen(pad, bildart) {
  letzterPad = pad; letzteBildart = bildart;
  const svg = "gehaeuse-" + pad + ".svg";
  document.getElementById("gehaeuse").src = svg;
  document.querySelector("#unterteil img").src = svg;
  document.querySelectorAll(".knopf, #dpad, #kappe").forEach(e => e.remove());
  // Querformat nur fuer N64 und nur im Spiel - die Auswahl bleibt hochkant.
  if (quer && pad === "n64" && laeuft) { aufbauenQuer(); return; }
  if (vollbild) { aufbauenVollbild(pad, bildart); return; }
  setzen(document.getElementById("bild"), geo.bild[bildart]);
  const geraet = document.getElementById("geraet");
  for (const [name, r] of Object.entries(geo.pads[pad].knoepfe)) {
    if (name === "DPAD") {
      const d = document.createElement("div");
      d.id = "dpad"; setzen(d, r);
      [["UP", 25, 0], ["DOWN", 25, 50], ["LEFT", 0, 25], ["RIGHT", 50, 25]]
        .forEach(([richtung, x, y]) => {
          const f = document.createElement("div");
          f.className = "feld"; f.style.left = x + "%"; f.style.top = y + "%";
          binden(f, richtung); d.appendChild(f);
        });
      geraet.appendChild(d);
    } else {
      const k = document.createElement("div");
      k.className = "knopf"; setzen(k, r);
      binden(k, name); geraet.appendChild(k);
    }
  }
  einpassen();
}

// --- Querformat: geteilter N64-Controller ----------------------------------
// Ein SP-Gehaeuse hat nur ein Steuerkreuz. Die N64-Spiele steuern fast alles
// ueber den Analogstick - quer ist Platz fuer einen echten, den man in jede
// Richtung ziehen kann statt nur in vier.
function aufbauenQuer() {
  const q = geo.quer;
  const geraet = document.getElementById("geraet");
  const vb = window.visualViewport;
  const bb = vb ? vb.width : innerWidth, bh = vb ? vb.height : innerHeight;
  const s = Math.min(bb / q.entwurf.w, bh / q.entwurf.h);
  geraet.style.width = (q.entwurf.w * s) + "px";
  geraet.style.height = (q.entwurf.h * s) + "px";
  document.getElementById("gehaeuse").src = "gehaeuse-n64quer.svg";
  setzen(document.getElementById("bild"), q.bild);

  for (const [name, r] of Object.entries(q.knoepfe)) {
    if (name === "STICK") { stickBauen(r, q.stick); continue; }
    if (name === "DPAD") {
      const d = document.createElement("div");
      d.id = "dpad"; setzen(d, r);
      // Quer gibt es Stick UND Kreuz. Das Kreuz bleibt hier das echte
      // Digitalkreuz des N64 - der Stick uebernimmt die analoge Rolle.
      [["DUP", 25, 0], ["DDOWN", 25, 50], ["DLEFT", 0, 25], ["DRIGHT", 50, 25]]
        .forEach(([richtung, x, y]) => {
          const f = document.createElement("div");
          f.className = "feld"; f.style.left = x + "%"; f.style.top = y + "%";
          binden(f, richtung); d.appendChild(f);
        });
      geraet.appendChild(d);
      continue;
    }
    const k = document.createElement("div");
    k.className = "knopf"; setzen(k, r);
    binden(k, name); geraet.appendChild(k);
  }
}

function stickBauen(r, masse) {
  const geraet = document.getElementById("geraet");
  const feld = document.createElement("div");
  feld.className = "knopf"; feld.id = "stickfeld"; setzen(feld, r);
  const kappe = document.createElement("div");
  kappe.id = "kappe";
  const kb = masse.kappe * 2;                       // Durchmesser in Prozent
  kappe.style.width = kb + "%";
  kappe.style.paddingBottom = "0";
  geraet.appendChild(feld);
  geraet.appendChild(kappe);

  const setzenKappe = (dx, dy) => {
    const f = feld.getBoundingClientRect();
    const g = geraet.getBoundingClientRect();
    const durchmesser = (masse.kappe * 2 / 100) * g.width;
    kappe.style.width = durchmesser + "px";
    kappe.style.height = durchmesser + "px";
    const spiel = f.width / 2 - durchmesser / 2;     // wie weit die Kappe darf
    const mx = f.left - g.left + f.width / 2 + dx * spiel;
    const my = f.top - g.top + f.height / 2 + dy * spiel;
    kappe.style.left = (mx - durchmesser / 2) + "px";
    kappe.style.top = (my - durchmesser / 2) + "px";
  };
  setzenKappe(0, 0);

  let aktiv = null;
  const auswerten = (px, py) => {
    const f = feld.getBoundingClientRect();
    let dx = (px - (f.left + f.width / 2)) / (f.width / 2);
    let dy = (py - (f.top + f.height / 2)) / (f.height / 2);
    const laenge = Math.hypot(dx, dy);
    if (laenge > 1) { dx /= laenge; dy /= laenge; }   // im Kreis bleiben
    setzenKappe(dx, dy);
    analog(dx, dy);
  };
  const los = ev => {
    ev.preventDefault();
    const t = ev.touches ? ev.touches[0] : ev;
    aktiv = true; auswerten(t.clientX, t.clientY);
  };
  const zieh = ev => {
    if (!aktiv) return;
    ev.preventDefault();
    const t = ev.touches ? ev.touches[0] : ev;
    auswerten(t.clientX, t.clientY);
  };
  const auf = ev => { if (!aktiv) return; ev.preventDefault(); aktiv = null;
                      setzenKappe(0, 0); analog(0, 0); };
  feld.addEventListener("touchstart", los, { passive: false });
  feld.addEventListener("touchmove", zieh, { passive: false });
  feld.addEventListener("touchend", auf, { passive: false });
  feld.addEventListener("touchcancel", auf, { passive: false });
  feld.addEventListener("mousedown", los);
  addEventListener("mousemove", zieh);
  addEventListener("mouseup", auf);
}

// Auslenkung an den Emulator: getrennte Achsen, Bereich bis 32767.
let letzteAchsen = "";
function analog(dx, dy) {
  const em = window.EJS_emulator;
  if (!em || !em.gameManager) return;
  // Nur bei Aenderung schicken - der Controller wird 60-mal je Sekunde
  // abgefragt, und jeder Aufruf sind vier Meldungen an den Emulator.
  const jetzt = dx.toFixed(3) + "," + dy.toFixed(3);
  if (jetzt === letzteAchsen) return;
  letzteAchsen = jetzt;
  const g = em.gameManager;
  // Totzone: der Finger sitzt nie genau in der Mitte, sonst zieht das Spiel
  // beim blossen Antippen schon leicht in eine Richtung (gemessen: 1,6 %).
  const TOT = 0.08;
  const w = v => {
    const a = Math.min(1, Math.abs(v));
    if (a < TOT) return 0;
    return Math.round((a - TOT) / (1 - TOT) * 32767);
  };
  try {
    g.simulateInput(0, 18, dx < 0 ? w(dx) : 0);      // links
    g.simulateInput(0, 19, dx > 0 ? w(dx) : 0);      // rechts
    g.simulateInput(0, 16, dy < 0 ? w(dy) : 0);      // hoch
    g.simulateInput(0, 17, dy > 0 ? w(dy) : 0);      // runter
  } catch (e) {}
}

function aufbauenVollbild(pad, bildart) {
  const geraet = document.getElementById("geraet");
  const breite = geraet.clientWidth, hoehe = geraet.clientHeight;

  // Unterteil unten in Originalproportionen, der Rest gehoert dem Bild.
  const unten = document.getElementById("unterteil");
  const untenH = breite * UNTERTEIL_H / geo.entwurf.w;
  unten.style.height = untenH + "px";
  // Das SVG zeigt das ganze Geraet; hier soll nur das Unterteil zu sehen sein,
  // also nach oben schieben, bis das Scharnier an der Oberkante sitzt.
  const bildH = breite * geo.entwurf.h / geo.entwurf.w;
  unten.querySelector("img").style.top = (-UNTERTEIL_Y / geo.entwurf.h * bildH) + "px";

  // Spielbild: so gross wie moeglich in der Flaeche darueber, Format gewahrt.
  const b = geo.bild[bildart];
  const seiten = (b.w / 100 * geo.entwurf.w) / (b.h / 100 * geo.entwurf.h);
  const platzH = hoehe - untenH;
  let sb = breite, sh = breite / seiten;
  if (sh > platzH) { sh = platzH; sb = platzH * seiten; }
  const el = document.getElementById("bild");
  el.style.left = ((breite - sb) / 2) + "px";
  el.style.top = ((platzH - sh) / 2) + "px";
  el.style.width = sb + "px";
  el.style.height = sh + "px";

  // Knoepfe auf das Unterteil legen - dieselbe Geometrie, nur anders gerechnet.
  for (const [name, r] of Object.entries(geo.pads[pad].knoepfe)) {
    const yD = r.y / 100 * geo.entwurf.h, hD = r.h / 100 * geo.entwurf.h;
    const lage = { x: r.x, w: r.w,
                   y: (yD - UNTERTEIL_Y) / UNTERTEIL_H * 100,
                   h: hD / UNTERTEIL_H * 100 };
    if (lage.y + lage.h <= 0) continue;          // liegt im Deckel
    if (name === "DPAD") {
      const d = document.createElement("div");
      d.id = "dpad"; setzen(d, lage);
      [["UP", 25, 0], ["DOWN", 25, 50], ["LEFT", 0, 25], ["RIGHT", 50, 25]]
        .forEach(([richtung, x, y]) => {
          const f = document.createElement("div");
          f.className = "feld"; f.style.left = x + "%"; f.style.top = y + "%";
          binden(f, richtung); d.appendChild(f);
        });
      unten.appendChild(d);
    } else {
      const k = document.createElement("div");
      k.className = "knopf"; setzen(k, lage);
      binden(k, name); unten.appendChild(k);
    }
  }
}

function ansichtUmschalten() {
  if (letzterPad !== "n64") {
    alert("Der geteilte Controller ist für Nintendo-64-Spiele gedacht.");
    return;
  }
  quer = !quer;
  localStorage.setItem("ansicht", quer ? "quer" : "hoch");
  if (quer) { vollbild = false; document.body.classList.remove("vollbild"); }
  beschriftungen();
  aufbauen(letzterPad, letzteBildart);
  menueUmschalten();
}

function beschriftungen() {
  MENUE[3].text = vollbild ? "Vollbild aus" : "Vollbild";
  MENUE[4].text = quer ? "Ansicht: Game Boy" : "Ansicht: N64-Controller";
}

function vollbildUmschalten() {
  vollbild = !vollbild;
  document.body.classList.toggle("vollbild", vollbild);
  beschriftungen();
  einpassen();
  aufbauen(letzterPad, letzteBildart);
  menueUmschalten();
}

// --- Auswahlbildschirm -----------------------------------------------------
function zeichneListe() {
  const ul = document.getElementById("liste");
  ul.innerHTML = "";
  const zeilen = spiele.map(s => ({
    titel: s.name,
    zeile2: (SYSTEME[s.endung] || {}).kurz + " · " + (s.groesse / 1048576).toFixed(1) + " MB",
    neu: false, spiel: s,
  }));
  zeilen.push({ titel: "+  Spiel hinzufügen",
                zeile2: "aus der Dateien-App", neu: true });
  zeilen.forEach((z, i) => {
    const li = document.createElement("li");
    if (i === wahl) li.className = "gewaehlt";
    if (z.neu) li.className += " neu";
    li.innerHTML = '<span class="pfeil">▶</span><span><span class="titel">'
      + z.titel.replace(/[<>&]/g, "") + '</span><br><span class="zeile2">'
      + z.zeile2 + "</span></span>";
    li.addEventListener("click", () => { wahl = i; zeichneListe(); waehlen(); });
    ul.appendChild(li);
  });
  const g = ul.querySelector(".gewaehlt");
  if (g) g.scrollIntoView({ block: "nearest" });
}

function bewegen(schritt) {
  const anzahl = spiele.length + 1;
  wahl = (wahl + schritt + anzahl) % anzahl;
  zeichneListe();
}

function waehlen() {
  if (wahl === spiele.length) { document.getElementById("datei").click(); return; }
  starte(spiele[wahl]);
}

document.getElementById("datei").addEventListener("change", async ev => {
  for (const datei of ev.target.files) {
    const endung = datei.name.split(".").pop().toLowerCase();
    if (!SYSTEME[endung]) { melden("Unbekannt: ." + endung); continue; }
    await merken({ id: datei.name, name: datei.name.replace(/\.[^.]+$/, ""),
                   endung: endung, groesse: datei.size, daten: datei });
  }
  spiele = await alleSpiele();
  wahl = 0; zeichneListe(); melden("");
  ev.target.value = "";
});

function melden(text) { document.getElementById("ladebalken").textContent = text; }

// --- Spiel starten ---------------------------------------------------------
function starte(eintrag) {
  const sys = SYSTEME[eintrag.endung];
  aktuell = sys; laeuft = true;
  aufbauen(sys.pad, sys.bild);
  document.getElementById("start").style.display = "none";
  hochfahren(URL.createObjectURL(eintrag.daten), eintrag.name, sys);
}

function starteFromUrl(url) {
  const endung = url.split("?")[0].split(".").pop().toLowerCase();
  const sys = SYSTEME[endung];
  if (!sys) { melden("Unbekannte Dateiendung: ." + endung); return; }
  aktuell = sys; laeuft = true;
  aufbauen(sys.pad, sys.bild);
  document.getElementById("start").style.display = "none";
  hochfahren(url, url.split("/").pop(), sys);
}

function hochfahren(url, name, sys) {
  window.EJS_player = "#game";
  window.EJS_core = sys.kern;
  window.EJS_gameUrl = url;
  window.EJS_gameName = name;
  window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
  window.EJS_startOnLoaded = true;
  window.EJS_Buttons = { playPause: false, restart: false, settings: false,
                         saveState: false, loadState: false, screenRecord: false,
                         gamepad: false, cheat: false, volume: false,
                         saveSavFiles: false, loadSavFiles: false,
                         quickSave: false, quickLoad: false, screenshot: false,
                         cacheManager: false, exitEmulation: false };
  putzen();
  // Sobald der Emulator steht, seine eigene Controller-Belegung loesen.
  const loesen = setInterval(() => { if (padEntkoppeln()) clearInterval(loesen); }, 300);
  setTimeout(() => clearInterval(loesen), 60000);
  const s = document.createElement("script");
  s.src = window.EJS_pathtodata + "loader.js";
  s.onerror = () => { document.getElementById("start").style.display = "";
                      melden("Emulator konnte nicht geladen werden – Internet?"); };
  document.body.appendChild(s);
}

// EmulatorJS wertet angeschlossene Controller selbst aus - mit eigener
// Belegung. Zusammen mit unserer waeren das doppelte und teils
// widerspruechliche Eingaben (nachgemessen: fremde Achsenwerte auf 17 und 23).
// Seine Zuordnung steht in controls[spieler][knopf].value2; ohne die greift
// nur noch unsere. Die Tastatur (value) bleibt unberuehrt.
function padEntkoppeln() {
  const em = window.EJS_emulator;
  if (!em || !em.controls) return false;
  for (const spieler of Object.values(em.controls)) {
    for (const knopf of Object.values(spieler)) {
      if (knopf && knopf.value2 !== undefined) knopf.value2 = "";
    }
  }
  return true;
}

function putzen() {
  // EmulatorJS baut seine Bildschirmsteuerung nach jeder Groessenaenderung neu
  // auf. Die Stilregeln oben fangen das ab, der Beobachter raeumt den Rest weg.
  const weg = () => document.querySelectorAll(
    ".ejs_virtualGamepad_parent, .ejs_virtualGamepad_left, .ejs_virtualGamepad_right")
    .forEach(e => e.remove());
  weg();
  new MutationObserver(weg).observe(document.body, { childList: true, subtree: true });
}

// --- Knoepfe ---------------------------------------------------------------
function nummer(name) {
  if (aktuell && aktuell.pad === "n64" && name in N64_TASTE) return N64_TASTE[name];
  return TASTE[name];
}

function senden(name, gedrueckt) {
  if (!laeuft) {                       // Auswahlbildschirm
    if (!gedrueckt) return;
    if (name === "UP" || name === "LEFT") bewegen(-1);
    else if (name === "DOWN" || name === "RIGHT") bewegen(1);
    else if (name === "A" || name === "START") waehlen();
    return;
  }
  if (name === "SPIEL") {              // SPIEL-Knopf: zurueck zur Auswahl
    if (gedrueckt) zurueck();
    return;
  }
  if (name === "MENU") {               // Power-Schalter: Spielstand-Menue
    if (gedrueckt) menueUmschalten();
    return;
  }
  if (menueOffen) {                    // im Menue steuert das Kreuz das Menue
    if (!gedrueckt) return;
    if (name === "UP" || name === "LEFT") menueBewegen(-1);
    else if (name === "DOWN" || name === "RIGHT") menueBewegen(1);
    else if (name === "A" || name === "START") menueWaehlen();
    return;
  }
  const em = window.EJS_emulator;
  if (!em || !em.gameManager) return;
  const nr = nummer(name);
  if (nr === undefined) return;
  // Analogachsen (16-23) brauchen einen Ausschlag, keinen Ein/Aus-Wert: der
  // Bereich geht bis 32767. Mit 1 stand der Stick praktisch still - Mario Kart
  // liess sich fahren, aber nicht lenken.
  const wert = gedrueckt ? (nr >= 16 && nr <= 23 ? 32767 : 1) : 0;
  try { em.gameManager.simulateInput(0, nr, wert); } catch (e) {}
}

// --- Menue im Spiel: Spielstand sichern und laden --------------------------
// Gesichert wird ein vollstaendiger Speicherpunkt (getState) als Datei. Der
// Browserspeicher haelt den Spielstand zwar von selbst, aber Safari raeumt
// Webseiten-Daten irgendwann auf - auf eine Datei in der Dateien-App ist
// mehr Verlass.
let menueOffen = false, menueWahl = 0;
const MENUE = [
  { text: "Spielstand sichern", tun: standSichern },
  { text: "Spielstand laden", tun: () => document.getElementById("stand").click() },
  { text: "Zurück zur Auswahl", tun: zurueck },
  { text: "Vollbild", tun: () => vollbildUmschalten() },
  { text: "Ansicht", tun: () => ansichtUmschalten() },
  { text: "Weiterspielen", tun: () => menueUmschalten() },
];

function menueUmschalten() {
  menueOffen = !menueOffen;
  beschriftungen();
  menueWahl = 0;
  zeichneMenue();
}

function menueBewegen(schritt) {
  menueWahl = (menueWahl + schritt + MENUE.length) % MENUE.length;
  zeichneMenue();
}

function menueWaehlen() { MENUE[menueWahl].tun(); }

function zeichneMenue() {
  let el = document.getElementById("menue");
  if (!menueOffen) { if (el) el.remove(); return; }
  if (!el) {
    el = document.createElement("div");
    el.id = "menue";
    document.getElementById("bild").appendChild(el);
  }
  el.innerHTML = "<h2>MENÜ</h2>" + MENUE.map((m, i) =>
    '<div class="zeile' + (i === menueWahl ? " gewaehlt" : "") + '" data-i="' + i
    + '"><span class="pfeil">▶</span>' + m.text + "</div>").join("");
  el.querySelectorAll(".zeile").forEach(z => z.addEventListener("click", () => {
    menueWahl = +z.dataset.i; zeichneMenue(); menueWaehlen();
  }));
}

function herunterladen(daten, name) {
  const url = URL.createObjectURL(new Blob([daten], { type: "application/octet-stream" }));
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

async function standSichern() {
  const gm = window.EJS_emulator && window.EJS_emulator.gameManager;
  if (!gm) return;
  try {
    gm.saveSaveFiles();
    const stand = await gm.getState();
    const name = (window.EJS_gameName || "spielstand")
      + " " + new Date().toISOString().slice(0, 16).replace(/[T:]/g, "-") + ".state";
    herunterladen(stand, name);
    menueUmschalten();
  } catch (e) { alert("Sichern nicht möglich: " + e); }
}

document.getElementById("stand").addEventListener("change", async ev => {
  const datei = ev.target.files[0];
  ev.target.value = "";
  if (!datei) return;
  const gm = window.EJS_emulator && window.EJS_emulator.gameManager;
  if (!gm) return;
  try {
    gm.loadState(new Uint8Array(await datei.arrayBuffer()));
    menueUmschalten();
  } catch (e) { alert("Laden nicht möglich: " + e); }
});

function zurueck() {
  // EmulatorJS kann ein zweites Spiel nicht sauber in denselben Bereich laden,
  // darum der Umweg ueber einen Neustart der Seite. Der Spielstand liegt in
  // der Datenbank des Emulators und ueberlebt das.
  try { window.EJS_emulator.gameManager.saveSaveFiles(); } catch (e) {}
  setTimeout(() => location.href = location.pathname, 400);
}

function binden(el, name) {
  const runter = ev => { ev.preventDefault(); el.classList.add("gedrueckt"); senden(name, true); };
  const hoch = ev => { ev.preventDefault(); el.classList.remove("gedrueckt"); senden(name, false); };
  el.addEventListener("touchstart", runter, { passive: false });
  el.addEventListener("touchend", hoch, { passive: false });
  el.addEventListener("touchcancel", hoch, { passive: false });
  el.addEventListener("mousedown", runter);
  el.addEventListener("mouseup", hoch);
  el.addEventListener("mouseleave", hoch);
}

// Tastatur am Rechner - praktisch zum Pruefen
addEventListener("keydown", e => {
  const m = { ArrowUp: "UP", ArrowDown: "DOWN", ArrowLeft: "LEFT", ArrowRight: "RIGHT",
              Enter: "START", x: "A", y: "B", z: "B" }[e.key];
  if (m) { senden(m, true); e.preventDefault(); }
});
addEventListener("keyup", e => {
  const m = { ArrowUp: "UP", ArrowDown: "DOWN", ArrowLeft: "LEFT", ArrowRight: "RIGHT",
              Enter: "START", x: "A", y: "B", z: "B" }[e.key];
  if (m) senden(m, false);
});

// --- PlayStation-Controller (und jeder andere Gamepad) ---------------------
// iOS koppelt DualShock 4 und DualSense seit iOS 13 selbst; Safari meldet sie
// ueber die Gamepad-Schnittstelle im Standard-Layout. Die Nummern unten sind
// dieses Layout, nicht Sony-eigene Zaehlung.
const PAD = {
  0: "KREUZ", 1: "KREIS", 2: "VIERECK", 3: "DREIECK",
  4: "L1", 5: "R1", 6: "L2", 7: "R2",
  8: "SHARE", 9: "OPTIONS", 10: "L3", 11: "R3",
  12: "OBEN", 13: "UNTEN", 14: "LINKS", 15: "RECHTS",
  16: "PS", 17: "TOUCHPAD",
};

// Welcher Knopf des Controllers loest welchen Knopf des Geraets aus.
// Getrennt nach System, weil ein N64 kein SELECT hat und ein Game Boy kein Z.
function padBelegung() {
  const n64 = aktuell && aktuell.pad === "n64";
  const digitalkreuz = n64 && quer;      // quer gibt es Stick UND Kreuz
  return {
    KREUZ: "A",
    KREIS: "B",
    VIERECK: n64 ? "B" : "B",            // zweite Taste fuer denselben Knopf
    DREIECK: n64 ? "CUP" : "A",
    L1: "L", R1: "R",
    L2: n64 ? "Z" : "L", R2: n64 ? "Z" : "R",
    OPTIONS: "START",
    SHARE: n64 ? null : "SELECT",
    OBEN: digitalkreuz ? "DUP" : "UP",
    UNTEN: digitalkreuz ? "DDOWN" : "DOWN",
    LINKS: digitalkreuz ? "DLEFT" : "LEFT",
    RECHTS: digitalkreuz ? "DRIGHT" : "RIGHT",
    L3: "MENU",                          // Menue oeffnen und schliessen
    TOUCHPAD: "SPIEL",                   // zurueck zur Spielauswahl
    PS: "MENU",
  };
}

const padStand = {};                     // was zuletzt gedrueckt war
let padDa = false;

addEventListener("gamepadconnected", ev => {
  padDa = true;
  melden("Controller verbunden: " + ev.gamepad.id.slice(0, 28));
  setTimeout(() => melden(""), 4000);
});
addEventListener("gamepaddisconnected", () => { padDa = false; melden(""); });

function padLesen() {
  requestAnimationFrame(padLesen);
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  const pad = [...pads].find(p => p);
  if (!pad) return;
  padDa = true;
  const belegung = padBelegung();

  // Knoepfe
  pad.buttons.forEach((b, i) => {
    const name = PAD[i];
    if (!name) return;
    const ziel = belegung[name];
    if (!ziel) return;
    const gedrueckt = b.pressed || b.value > 0.5;
    if (padStand[name] === gedrueckt) return;
    padStand[name] = gedrueckt;
    senden(ziel, gedrueckt);
  });

  // Linker Stick: beim N64 der Analogstick, sonst das Steuerkreuz
  const [x, y] = [pad.axes[0] || 0, pad.axes[1] || 0];
  if (aktuell && aktuell.pad === "n64" && laeuft) {
    analog(x, y);
  } else {
    richtungAusAchse("UP", y < -0.5); richtungAusAchse("DOWN", y > 0.5);
    richtungAusAchse("LEFT", x < -0.5); richtungAusAchse("RIGHT", x > 0.5);
  }

  // Rechter Stick: beim N64 das C-Kreuz
  if (aktuell && aktuell.pad === "n64" && laeuft) {
    const rx = pad.axes[2] || 0, ry = pad.axes[3] || 0;
    richtungAusAchse("CUP", ry < -0.5); richtungAusAchse("CDOWN", ry > 0.5);
    richtungAusAchse("CLEFT", rx < -0.5); richtungAusAchse("CRIGHT", rx > 0.5);
  }
}

function richtungAusAchse(name, gedrueckt) {
  const schluessel = "achse-" + name;
  if (padStand[schluessel] === gedrueckt) return;
  padStand[schluessel] = gedrueckt;
  senden(name, gedrueckt);
}

requestAnimationFrame(padLesen);

addEventListener("gesturestart", e => e.preventDefault());
addEventListener("dblclick", e => e.preventDefault());
</script>
